{% extends "base.html" %}
{% block title %}Contact — {{ brand_name }}{% endblock %}
{% block content %}
<div class="container section" style="max-width:560px;">
  <h1 class="section-title" style="text-align:left;">Contact us</h1>
  <form id="contact-form">
    <div class="form-group"><label for="ct-name">Name *</label><input id="ct-name" required maxlength="150"></div>
    <div class="form-group"><label for="ct-email">Email *</label><input id="ct-email" type="email" required maxlength="200"></div>
    <div class="form-group"><label for="ct-message">Message *</label><textarea id="ct-message" required maxlength="3000" rows="5"></textarea></div>
    <button type="submit" class="btn btn-primary">Send message</button>
  </form>
</div>
{% endblock %}
{% block scripts %}
<script>
document.getElementById('contact-form').addEventListener('submit',async function(e){
  e.preventDefault();
  var btn=e.target.querySelector('button[type=submit]');
  if(window.ABC_busy) ABC_busy(btn,true); else btn.disabled=true;
  try{
    var res=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      name:document.getElementById('ct-name').value.trim(),
      email:document.getElementById('ct-email').value.trim(),
      message:document.getElementById('ct-message').value.trim()
    })});
    var data=await res.json();
    if(res.ok){
      e.target.closest('.container').innerHTML='<div class="success-burst"><div class="burst-icon">✉</div><h1 style="font-family:var(--font-display);margin:0 0 .5rem">Message sent</h1><p style="color:var(--color-muted)">'+ (data.message||'We will reply soon.') +'</p><a href="/" class="btn btn-primary" style="margin-top:1rem">Home</a></div>';
    } else if(window.ABC_toast) ABC_toast(data.error||'Failed', true);
  }catch(err){ if(window.ABC_toast) ABC_toast('Network error',true); if(window.ABC_busy) ABC_busy(btn,false); else btn.disabled=false; }
});
</script>
{% endblock %}
